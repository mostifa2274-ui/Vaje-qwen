name: Optional direct Cloudflare deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghesse-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_BRANCH: main
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GHESSE_RIGHTS_CONFIRMED: ${{ secrets.GHESSE_RIGHTS_CONFIRMED }}

    steps:
      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare GitHub Actions credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Direct deployment NOT performed: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured. Cloudflare Git integration remains the deployment path."
            {
              echo "## Direct Cloudflare deploy skipped"
              echo ""
              echo "- Source revision: \`$SOURCE_SHA\`"
              echo "- Reason: GitHub Actions Cloudflare credentials are not configured"
              echo "- Active deployment path: Cloudflare Git integration"
              echo ""
              echo "A green workflow result here means the optional fallback behaved correctly; it does not mean Wrangler deployed production."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out exact verified revision
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Set up Node
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Pin npm
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm install --global npm@11.19.1 && npm --version

      - name: Install locked dependencies
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Enforce public release rights gate
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm run release:check

      - name: Build exact verified revision
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          WORKERS_CI_COMMIT_SHA: ${{ env.SOURCE_SHA }}
          WORKERS_CI_BRANCH: ${{ env.SOURCE_BRANCH }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          WORKERS_CI_COMMIT_SHA: ${{ env.SOURCE_SHA }}
          WORKERS_CI_BRANCH: ${{ env.SOURCE_BRANCH }}
        run: npx wrangler@4.135.0 deploy
