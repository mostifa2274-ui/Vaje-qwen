name: Production deployment fallback

# Cloudflare Git integration remains the primary deployment path.
# After an exact-main CI pass, this workflow first waits for that integration.
# If production is still stale, it can fall back to Wrangler using repository
# secrets. Manual execution remains available for an operator retry.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghesse-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SOURCE_BRANCH: main
      PRODUCTION_URL: https://vaje-qwen1.mostifa2273.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Confirm exact current main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$SOURCE_SHA" = "$main_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Deploy candidate is current main: $SOURCE_SHA"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded revision $SOURCE_SHA; current main is $main_sha."
          fi

      - name: Wait for Cloudflare Git deployment
        id: primary
        if: steps.source.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for the primary Cloudflare Git integration to publish $SOURCE_SHA."
          max_attempts=30
          echo "Primary deployment verification window: $max_attempts attempts."
          for attempt in $(seq 1 "$max_attempts"); do
            marker="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20               "$PRODUCTION_URL/release.json?fresh=$(date +%s)" || true)"
            if printf '%s' "$marker" | jq -e --arg commit "$SOURCE_SHA"               '.release == "ghesse-5.0.0" and .worker == "vaje-qwen1" and .commit == $commit and .branch == "main"' >/dev/null; then
              if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 "$PRODUCTION_URL/" >/dev/null                 && worker="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 "$PRODUCTION_URL/sw.js?fresh=$(date +%s)")"                 && [[ "$worker" == *"ghesse-shell-${SOURCE_SHA:0:16}"* ]]; then
                echo "needs_deploy=false" >> "$GITHUB_OUTPUT"
                echo "Primary deployment already converged on $SOURCE_SHA."
                exit 0
              fi
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then sleep 5; fi
          done
          echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
          echo "::warning::Primary Cloudflare Git deployment did not converge on $SOURCE_SHA; evaluating direct fallback."

      - name: Check direct-deploy credentials
        id: cloudflare
        if: steps.source.outputs.current == 'true' && steps.primary.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Wrangler fallback credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Direct Wrangler fallback credentials are not configured; continuing to wait for the primary Cloudflare Git deployment."
            {
              echo "## Direct fallback unavailable"
              echo ""
              echo "- Expected revision: `$SOURCE_SHA`"
              echo "- Primary Cloudflare Git deployment: still pending"
              echo "- Direct Wrangler credentials: missing"
              echo "- Action: keep polling production instead of failing early"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out exact verified revision
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Set up Node
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Pin npm
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm install --global npm@11.19.1 && npm --version

      - name: Install locked dependencies
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build exact verified revision
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          WORKERS_CI_COMMIT_SHA: ${{ env.SOURCE_SHA }}
          WORKERS_CI_BRANCH: ${{ env.SOURCE_BRANCH }}
        run: npm run build && npm run validate:bundle-budget

      - name: Deploy exact revision with Wrangler
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          WORKERS_CI_COMMIT_SHA: ${{ env.SOURCE_SHA }}
          WORKERS_CI_BRANCH: ${{ env.SOURCE_BRANCH }}
        run: npx wrangler@4.135.0 deploy

      - name: Verify exact production revision
        if: steps.source.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.primary.outputs.needs_deploy }}" = "true" ] && [ "${{ steps.cloudflare.outputs.configured }}" != "true" ]; then
            max_attempts=96
          else
            max_attempts=24
          fi
          echo "Final production verification window: $max_attempts attempts."
          for attempt in $(seq 1 "$max_attempts"); do
            marker="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20               "$PRODUCTION_URL/release.json?fresh=$(date +%s)" || true)"
            if printf '%s' "$marker" | jq -e --arg commit "$SOURCE_SHA"               '.release == "ghesse-5.0.0" and .worker == "vaje-qwen1" and .commit == $commit and .branch == "main"' >/dev/null; then
              if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 "$PRODUCTION_URL/" >/dev/null                 && worker="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 "$PRODUCTION_URL/sw.js?fresh=$(date +%s)")"                 && [[ "$worker" == *"ghesse-shell-${SOURCE_SHA:0:16}"* ]]; then
                {
                  echo "## Production deployment verified"
                  echo ""
                  echo "- Exact revision: `$SOURCE_SHA`"
                  echo "- Production root reachable: yes"
                  echo "- Service-worker cache matches: yes"
                  if [ "${{ steps.primary.outputs.needs_deploy }}" = "true" ]; then
                    echo "- Deployment path: direct Wrangler fallback"
                  else
                    echo "- Deployment path: Cloudflare Git integration"
                  fi
                } >> "$GITHUB_STEP_SUMMARY"
                echo "Production is exactly $SOURCE_SHA."
                exit 0
              fi
            fi
            if [ "$attempt" -lt 24 ]; then sleep 5; fi
          done
          echo "::error::Production did not converge on exact revision $SOURCE_SHA after deployment."
          exit 1
