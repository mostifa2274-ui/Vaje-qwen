name: Optional direct Cloudflare deploy

# Manual only (Actions > Optional direct Cloudflare deploy > Run workflow).
# Cloudflare's Git integration deploys main; without the two secrets below
# this fallback did nothing but still spent Actions minutes after each merge.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghesse-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # A manual run can target any branch; only main may reach production.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_BRANCH: main
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare GitHub Actions credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Direct deployment NOT performed: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured. Cloudflare Git integration remains the deployment path."
            {
              echo "## Direct Cloudflare deploy skipped"
              echo ""
              echo "- Source revision: \`$SOURCE_SHA\`"
              echo "- Reason: GitHub Actions Cloudflare credentials are not configured"
              echo "- Active deployment path: Cloudflare Git integration"
              echo ""
              echo "A green workflow result here means the optional fallback behaved correctly; it does not mean Wrangler deployed production."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out exact verified revision
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Set up Node
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Pin npm
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm install --global npm@11.19.1 && npm --version

      - name: Install locked dependencies
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build exact verified revision
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          WORKERS_CI_COMMIT_SHA: ${{ env.SOURCE_SHA }}
          WORKERS_CI_BRANCH: ${{ env.SOURCE_BRANCH }}
        run: npm run build && npm run validate:bundle-budget

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          WORKERS_CI_COMMIT_SHA: ${{ env.SOURCE_SHA }}
          WORKERS_CI_BRANCH: ${{ env.SOURCE_BRANCH }}
        run: npx wrangler@4.135.0 deploy
