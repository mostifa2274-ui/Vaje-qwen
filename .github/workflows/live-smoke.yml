name: Production smoke

# Start after production CI or Cloudflare reports success. The CI trigger also
# covers GitHub suppressing check_run events associated with Actions.
# Manual verification remains available.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  check_run:
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ghesse-production-smoke-${{ github.event.check_run.head_sha || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  live:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
       github.event.check_run.name == 'Workers Builds: vaje-qwen1' &&
       github.event.check_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PRODUCTION_URL: https://vaje-qwen1.mostifa2273.workers.dev
      SOURCE_SHA: ${{ github.event.check_run.head_sha || github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Ignore superseded or non-production commits
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$SOURCE_SHA" = "$main_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping $SOURCE_SHA: current main is $main_sha."
          fi
      - name: Wait for exact Cloudflare production revision
        if: steps.source.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          last_compact=''
          last_worker_cache='not fetched'

          echo "Verifying source revision: $SOURCE_SHA"
          echo "Production worker: $PRODUCTION_URL"

          for attempt in $(seq 1 30); do
            echo "Smoke attempt $attempt/30 for $SOURCE_SHA"
            body="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 "$PRODUCTION_URL/release.json?fresh=$(date +%s)" || true)"
            compact="$(printf '%s' "$body" | tr -d '[:space:]')"
            last_compact="$compact"

            if [ "$attempt" -eq 1 ] || [ $((attempt % 5)) -eq 0 ]; then
              echo "Observed live marker: ${compact:-<empty>}"
            fi

            if printf '%s' "$body" | jq -e --arg commit "$SOURCE_SHA" \
              '.release == "ghesse-5.0.0" and .worker == "vaje-qwen1" and .commit == $commit and .branch == "main"' >/dev/null; then
              # Cloudflare can expose release.json before the root or worker
              # has propagated. Retry the whole probe within the same window.
              if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 "$PRODUCTION_URL/" >/dev/null \
                && worker="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 "$PRODUCTION_URL/sw.js?fresh=$(date +%s)")"; then
                last_worker_cache="$(printf '%s' "$worker" | grep -Eo 'ghesse-shell-[a-zA-Z0-9_-]+' | head -n 1 || true)"
                if [[ "$worker" == *"ghesse-shell-${SOURCE_SHA:0:16}"* ]]; then
                  echo "Verified exact release and service-worker revision $SOURCE_SHA; production root is reachable."
                  {
                    echo "## Production verification"
                    echo ""
                    echo "- Exact revision verified: $SOURCE_SHA"
                    echo "- Worker: vaje-qwen1"
                    echo "- Root reachable: yes"
                    echo "- Service-worker cache matches revision: yes"
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                echo "Waiting for service-worker revision; observed cache: ${last_worker_cache:-<missing>}"
              else
                last_worker_cache='root or service-worker request failed'
                echo "Waiting for production root and service worker to become reachable."
              fi
            fi

            if [ "$attempt" -lt 30 ]; then sleep 5; fi
          done

          {
            echo "## Production verification failed"
            echo ""
            echo "- Expected revision: $SOURCE_SHA"
            echo "- Worker: vaje-qwen1"
            echo "- Last marker: ${last_compact:-<empty>}"
            echo "- Last service-worker cache: ${last_worker_cache:-<missing>}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Production release, root and service worker did not converge on commit $SOURCE_SHA within the smoke window. Last marker: ${last_compact:-<empty>}. Last service-worker cache: ${last_worker_cache:-<missing>}"
          exit 1
