name: Audit Book 8 vocabulary

on:
  push:
    branches: [vocabulary-order-book8]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Audit controlled story vocabulary
        run: node scripts/resequence-chapter-vocabulary.mjs
