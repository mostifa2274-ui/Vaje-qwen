name: Regenerate story continuity audio

on:
  push:
    branches: [generated-art-batch-3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-story-continuity-audio
  cancel-in-progress: true

jobs:
  audio:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[audio-pack]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: generated-art-batch-3
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Kokoro generation dependencies
        run: |
          python -m pip install --disable-pip-version-check "misaki[en]==0.9.4" onnxruntime==1.30.0 onnx==1.19.1 lameenc==1.8.4 numpy
          python -m pip install --disable-pip-version-check https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Fetch pinned Kokoro voice assets
        run: |
          curl -fL --retry 3 -o /tmp/model_fp16.onnx https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/onnx/model_fp16.onnx
          curl -fL --retry 3 -o /tmp/af_heart.bin https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/af_heart.bin
          echo "ba4527a874b42b21e35f468c10d326fdff3c7fc8cac1f85e9eb6c0dfc35c334a  /tmp/model_fp16.onnx" | sha256sum -c -
          echo "d583ccff3cdca2f7fae535cb998ac07e9fcb90f09737b9a41fa2734ec44a8f0b  /tmp/af_heart.bin" | sha256sum -c -
          python scripts/audio/upcast_model.py /tmp/model_fp16.onnx /tmp/model_fp32.onnx
      - name: Generate and reconcile narration
        run: |
          for attempt in 1 2 3; do
            git fetch origin generated-art-batch-3
            git reset --hard origin/generated-art-batch-3
            python scripts/audio/generate_audio.py --model /tmp/model_fp32.onnx --voice /tmp/af_heart.bin
            node scripts/validate-data.mjs
            git fetch origin generated-art-batch-3
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/generated-art-batch-3)" ]; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "Branch kept changing while audio was generated."
              exit 1
            fi
          done
      - name: Commit regenerated audio
        run: |
          if git diff --quiet -- public/audio; then
            echo "Narration pack is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          git commit -m "Regenerate narration for story continuity [audio-pack]"
          git push origin HEAD:generated-art-batch-3
