name: Word narration trial (temporary)

on:
  push:
    branches: [claude/app-quality-analysis-ti4lje]
    paths:
      - 'scripts/audio/**'
      - '.github/workflows/word-narration-trial.yml'

permissions:
  contents: read

concurrency:
  group: word-narration-trial
  cancel-in-progress: true

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        name: [base, period, style32, period32, wrap, space_period]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Kokoro dependencies and the trial tools
        run: |
          python -m pip install --disable-pip-version-check "misaki[en]==0.9.4" onnxruntime==1.30.0 onnx==1.19.1 lameenc==1.8.4 numpy miniaudio faster-whisper
          python -m pip install --disable-pip-version-check https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Fetch pinned Kokoro voice assets
        run: |
          curl -fL --retry 3 -o /tmp/model_fp16.onnx https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/onnx/model_fp16.onnx
          curl -fL --retry 3 -o /tmp/af_heart.bin https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/af_heart.bin
          echo "ba4527a874b42b21e35f468c10d326fdff3c7fc8cac1f85e9eb6c0dfc35c334a  /tmp/model_fp16.onnx" | sha256sum -c -
          echo "d583ccff3cdca2f7fae535cb998ac07e9fcb90f09737b9a41fa2734ec44a8f0b  /tmp/af_heart.bin" | sha256sum -c -
          python scripts/audio/upcast_model.py /tmp/model_fp16.onnx /tmp/model_fp32.onnx
      - name: Try one single-word strategy
        run: python -u scripts/audio/word_onset_trial.py --model /tmp/model_fp32.onnx --voice /tmp/af_heart.bin --strategy ${{ matrix.name }}
