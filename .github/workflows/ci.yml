name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: vajeh-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore verified Vajeh source
        run: node bootstrap/restore.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Run quality gates
        run: npm run check
