name: Resequence chapter vocabulary

on:
  push:
    branches:
      - vocabulary-order-hardening

permissions:
  contents: write

jobs:
  resequence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resequence words by first story use
        run: node scripts/resequence-chapter-vocabulary.mjs

      - name: Validate prerequisite vocabulary
        run: node scripts/validate-introductions.mjs

      - name: Commit resequenced chapters
        run: |
          if git diff --quiet -- src/data/chapters; then
            echo "No chapter assignment changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/chapters
          git commit -m "Resequence chapter vocabulary by first story use"
          git push
