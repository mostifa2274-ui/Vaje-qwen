name: Open vocabulary candidate snapshot

on:
  push:
    branches:
      - provenance/open-vocab-snapshot
    paths:
      - .github/workflows/open-vocab-candidates.yml
      - scripts/build-open-vocab-candidates.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghesse-open-vocab-candidates
  cancel-in-progress: true

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reconstruction tooling
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download official Tatoeba English CC0 export
        shell: bash
        run: |
          set -euo pipefail
          source_url='https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences_CC0.tsv.bz2'
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "$source_url" \
            --output /tmp/eng_sentences_CC0.tsv.bz2
          test -s /tmp/eng_sentences_CC0.tsv.bz2
          sha256sum /tmp/eng_sentences_CC0.tsv.bz2

      - name: Build independent candidate pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ghesse-open-vocab
          python scripts/build-open-vocab-candidates.py \
            --input /tmp/eng_sentences_CC0.tsv.bz2 \
            --output /tmp/ghesse-open-vocab/tatoeba-cc0-candidates.json \
            --limit 5000
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/ghesse-open-vocab/tatoeba-cc0-candidates.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['releaseClearingEvidence'] is False
          assert data['method']['legacyVocabularyConsulted'] is False
          assert len(data['candidates']) == 5000
          assert data['stats']['sentences'] > 0
          assert data['source']['sha256']
          print(json.dumps({
              'sourceSha256': data['source']['sha256'],
              'sentences': data['stats']['sentences'],
              'uniqueTokens': data['stats']['uniqueTokens'],
              'candidateCount': len(data['candidates']),
              'top20': [item['word'] for item in data['candidates'][:20]],
          }, ensure_ascii=False))
          PY

      - name: Upload reconstruction artifact
        uses: actions/upload-artifact@v4
        with:
          name: tatoeba-cc0-independent-candidates
          path: /tmp/ghesse-open-vocab/tatoeba-cc0-candidates.json
          if-no-files-found: error
          retention-days: 30

      - name: Download official VOA Learning English Word Book
        shell: bash
        run: |
          set -euo pipefail
          voa_url='https://docs.voanews.eu/en-us-learn/2022/06/07/c4dbd6af-5f63-4f28-bc42-0bd175f4e4b4.pdf'
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            "$voa_url" \
            --output /tmp/voa-learning-english-word-book.pdf
          test -s /tmp/voa-learning-english-word-book.pdf
          sha256sum /tmp/voa-learning-english-word-book.pdf

      - name: Extract VOA Word Book text
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pypdf==6.0.0
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          source = Path('/tmp/voa-learning-english-word-book.pdf')
          target = Path('/tmp/ghesse-open-vocab/voa-word-book-extracted.txt')
          reader = PdfReader(str(source))
          with target.open('w', encoding='utf-8') as handle:
              for page_number, page in enumerate(reader.pages, 1):
                  handle.write(f'\n===== PAGE {page_number} =====\n')
                  handle.write(page.extract_text() or '')
                  handle.write('\n')
          print(f'Extracted {len(reader.pages)} pages to {target}')
          PY

      - name: Upload VOA extraction artifact
        uses: actions/upload-artifact@v4
        with:
          name: voa-word-book-extracted
          path: /tmp/ghesse-open-vocab/voa-word-book-extracted.txt
          if-no-files-found: error
          retention-days: 30

      - name: Snapshot VOA Level 1 beginner-course language
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet requests==2.32.5 beautifulsoup4==4.13.5
          python - <<'PY'
          import hashlib
          import json
          import re
          from collections import Counter
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          INDEX = 'https://learningenglish.voanews.com/p/5644.html'
          TOKEN = re.compile(r"[A-Za-z]+(?:['’][A-Za-z]+)?")
          session = requests.Session()
          session.headers.update({'User-Agent': 'Ghesse-open-vocab-research/1.0'})

          def fetch(url):
              response = session.get(url, timeout=30)
              response.raise_for_status()
              return response.content

          index_bytes = fetch(INDEX)
          soup = BeautifulSoup(index_bytes, 'html.parser')
          lessons = {}
          for link in soup.find_all('a', href=True):
              label = ' '.join(link.stripped_strings)
              match = re.match(r'^Lesson\s+(\d+)\s*:', label, flags=re.I)
              if not match:
                  continue
              number = int(match.group(1))
              if 1 <= number <= 52:
                  lessons[number] = urljoin(INDEX, link['href'])

          if sorted(lessons) != list(range(1, 53)):
              raise SystemExit(f'Expected lessons 1..52, found {sorted(lessons)}')

          tokens = Counter()
          lesson_records = []
          for number in range(1, 53):
              url = lessons[number]
              raw = fetch(url)
              page = BeautifulSoup(raw, 'html.parser')
              paragraphs = [' '.join(p.stripped_strings) for p in page.find_all('p')]
              article_text = '\n'.join(text for text in paragraphs if text)
              normalized = [
                  match.group(0).lower().replace('’', "'")
                  for match in TOKEN.finditer(article_text)
              ]
              tokens.update(normalized)
              lesson_records.append({
                  'lesson': number,
                  'url': url,
                  'htmlSha256': hashlib.sha256(raw).hexdigest(),
                  'paragraphs': len(paragraphs),
                  'tokens': len(normalized),
              })

          output = {
              'schemaVersion': 1,
              'kind': 'voa-level1-beginner-course-frequency',
              'releaseClearingEvidence': False,
              'source': {
                  'name': "VOA Let's Learn English - Level 1",
                  'indexUrl': INDEX,
                  'indexSha256': hashlib.sha256(index_bytes).hexdigest(),
                  'publicDomainPolicy': 'https://learningenglish.voanews.com/p/6861.html',
              },
              'method': {
                  'lessons': 52,
                  'textSurface': 'HTML paragraph text',
                  'tokenizer': "ASCII English words plus internal apostrophe; lowercase normalization",
                  'legacyVocabularyConsulted': False,
              },
              'lessons': lesson_records,
              'tokenCounts': dict(sorted(tokens.items(), key=lambda item: (-item[1], item[0]))),
          }

          target = '/tmp/ghesse-open-vocab/voa-level1-frequency.json'
          with open(target, 'w', encoding='utf-8') as handle:
              json.dump(output, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          print(json.dumps({
              'lessons': len(lesson_records),
              'uniqueTokens': len(tokens),
              'totalTokens': sum(tokens.values()),
              'top20': tokens.most_common(20),
          }, ensure_ascii=False))
          PY

      - name: Upload VOA Level 1 snapshot
        uses: actions/upload-artifact@v4
        with:
          name: voa-level1-beginner-frequency
          path: /tmp/ghesse-open-vocab/voa-level1-frequency.json
          if-no-files-found: error
          retention-days: 30
